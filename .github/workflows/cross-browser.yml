name: Cross-browser SQL checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-browser-${{ github.workflow }}-${{ github.ref }}
  # Runs on main are never cancelled, so each pushed commit keeps its evidence. Other branches still cancel superseded runs.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  browser:
    name: PostgreSQL and game — ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    # WebKit's media and GTK dependencies took the full 25 minutes on a hosted runner
    # (run 40551396895). Chromium keeps its original limit.
    timeout-minutes: ${{ matrix.browser == 'webkit' && 45 || 25 }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      PLAYWRIGHT_BROWSERS_PATH: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install both browser binaries
        run: npx playwright install chromium webkit
      - name: Install browser Linux dependencies
        id: deps
        timeout-minutes: 25
        run: |
          # Apt mirrors can stall mid-download; retry before failing the job.
          for attempt in 1 2 3; do
            if npx playwright install-deps chromium webkit; then exit 0; fi
            echo "install-deps attempt $attempt failed; retrying" >&2
            sleep $((attempt * 15))
          done
          exit 1
      - name: Lint
        id: lint
        run: npm run lint
      - name: Unit and integration tests
        id: unit
        run: npm test
      - name: TypeScript and production build
        id: build
        run: npm run build
      - name: Production debug-hook scan
        id: scan
        run: npm run check:production
      - name: Engine capability, transfer, and timing checks
        id: spike
        run: |
          rm -f docs/spike-${{ matrix.browser }}.json docs/app-transfer-${{ matrix.browser }}.json
          node scripts/engine-spike.mjs ${{ matrix.browser }}
          node scripts/app-transfer.mjs ${{ matrix.browser }}
      - name: Tap journeys and accessibility at both widths
        id: browser_tests
        run: npx playwright test --project=${{ matrix.browser }}
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sql-${{ matrix.browser }}-${{ github.sha }}
          path: |
            docs/spike-${{ matrix.browser }}.json
            docs/app-transfer-${{ matrix.browser }}.json
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
      - name: Write public job summary
        if: always()
        env:
          SQL_LINT_OUTCOME: ${{ steps.lint.outcome }}
          SQL_UNIT_OUTCOME: ${{ steps.unit.outcome }}
          SQL_BUILD_OUTCOME: ${{ steps.build.outcome }}
          SQL_SCAN_OUTCOME: ${{ steps.scan.outcome }}
          SQL_SPIKE_OUTCOME: ${{ steps.spike.outcome }}
          SQL_BROWSER_OUTCOME: ${{ steps.browser_tests.outcome }}
        run: node scripts/ci-summary.mjs ${{ matrix.browser }}
