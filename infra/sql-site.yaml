AWSTemplateFormatVersion: '2010-09-09'
Description: >
  The Larkspur SQL Desk: a private S3 bucket behind a CloudFront distribution (Origin Access Control), with response headers,
  cache rules, a CloudFront Function that serves the precompressed engine files, a web ACL, a GitHub Actions deploy role trusted
  only for main, and a monthly cost budget for the Project tag. Deploy in us-east-1, after infra/sql-cert.yaml (its CertificateArn
  output is the CertificateArn parameter). The distribution's pricing plan (Free) is chosen in the CloudFront console, because
  CloudFormation has no property for it.

Parameters:
  DomainName:
    Type: String
    Default: sql.edwardtorres.dev
    Description: The host name the site is served from. Must match the certificate.
  CertificateArn:
    Type: String
    Description: The CertificateArn output of the certificate stack (us-east-1, validated).
  GitHubRepository:
    Type: String
    Default: edwardtorres/SQL-Study
    Description: owner/name of the repository whose main branch may deploy. Case matters for the OIDC subject.
  CreateGitHubOidcProvider:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Set to true only when this account has no GitHub OIDC provider yet. An account can have one per URL.
  ExistingGitHubOidcProviderArn:
    Type: String
    Default: ''
    Description: Required when CreateGitHubOidcProvider is false. The ARN of the existing provider from IAM, Identity providers.
  BudgetEmail:
    Type: String
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
    Description: Where budget alerts are sent. Supplied at deploy time; never committed.
  BudgetLimitUsd:
    Type: Number
    MinValue: 1
    Description: The monthly budget for resources tagged Project=sql-study, in US dollars. Supplied at deploy time.

Conditions:
  CreateOidcProvider: !Equals [!Ref CreateGitHubOidcProvider, 'true']

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Project
          Value: sql-study

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontReadThisDistributionOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}'
          - Sid: DenyPlainHttp
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub '${SiteBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        Description: Lets only this distribution read the private site bucket.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub '${AWS::StackName}-acl'
      Description: Default allow, no rules. A pricing plan requires a web ACL on the distribution, and the plan covers the charges for it.
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: !Sub '${AWS::StackName}-acl'
        SampledRequestsEnabled: true
      Tags:
        - Key: Project
          Value: sql-study

  NegotiateFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-negotiate'
      AutoPublish: true
      FunctionConfig:
        Comment: 'Serves the brotli or gzip sibling of a hashed asset that the viewer accepts. Source: infra/functions/negotiate.js.'
        Runtime: cloudfront-js-2.0
      # The same text as infra/functions/negotiate.js. tests/infra.test.ts fails if the two differ.
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (!/^\/assets\/[^/]+\.(js|css|wasm|data)$/.test(uri)) return request;
          var accept = request.headers['accept-encoding'] ? request.headers['accept-encoding'].value : '';
          if (/\bbr\b/.test(accept)) {
            request.uri = uri + '.br';
          } else if (/\bgzip\b/.test(accept)) {
            request.uri = uri + '.gz';
          }
          return request;
        }

  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-security-headers'
        Comment: The desk's Content-Security-Policy and headers. The policy string must equal src/security/csp.ts (tests/infra.test.ts checks it).
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            ContentSecurityPolicy: "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: false
            Preload: false
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: 'camera=(), microphone=(), geolocation=(), payment=(), usb=()'
              Override: true
            # Responses for an asset depend on Accept-Encoding, so shared caches must keep the variants apart.
            - Header: Vary
              Value: Accept-Encoding
              Override: true

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub 'The Larkspur SQL Desk (${DomainName})'
        Enabled: true
        Aliases:
          - !Ref DomainName
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        WebACLId: !GetAtt WebAcl.Arn
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: site-bucket
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: site-bucket
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          # Managed CachingOptimized: the origin's Cache-Control decides. Hashed assets are immutable; everything else is no-cache.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref SecurityHeaders
        CacheBehaviors:
          # The entry page, the offline worker and the manifest are never cached at the edge, so a deploy takes effect at once.
          - PathPattern: /index.html
            TargetOriginId: site-bucket
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            ResponseHeadersPolicyId: !Ref SecurityHeaders
          - PathPattern: /404.html
            TargetOriginId: site-bucket
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            ResponseHeadersPolicyId: !Ref SecurityHeaders
          - PathPattern: /sw.js
            TargetOriginId: site-bucket
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            ResponseHeadersPolicyId: !Ref SecurityHeaders
          - PathPattern: /manifest.webmanifest
            TargetOriginId: site-bucket
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            ResponseHeadersPolicyId: !Ref SecurityHeaders
          # The hashed files the desk loads. The function chooses the brotli or gzip sibling the viewer accepts.
          - PathPattern: /assets/*
            TargetOriginId: site-bucket
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            ResponseHeadersPolicyId: !Ref SecurityHeaders
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt NegotiateFunction.FunctionMetadata.FunctionARN
        CustomErrorResponses:
          # A private bucket answers a missing object with 403, not 404, so both map to the static 404 page with status 404.
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 10
      Tags:
        - Key: Project
          Value: sql-study

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      Tags:
        - Key: Project
          Value: sql-study

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: GitHubActionsFromMainOnly
            Effect: Allow
            Principal:
              Federated: !If [CreateOidcProvider, !Ref GitHubOidcProvider, !Ref ExistingGitHubOidcProviderArn]
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubRepository}:ref:refs/heads/main'
      Policies:
        - PolicyName: publish-site
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ListSiteBucket
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt SiteBucket.Arn
              - Sid: WriteSiteObjects
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub '${SiteBucket.Arn}/*'
              - Sid: InvalidateSiteDistribution
                Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}'
      Tags:
        - Key: Project
          Value: sql-study

  ProjectBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub '${AWS::StackName}-monthly'
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref BudgetLimitUsd
          Unit: USD
        CostFilters:
          TagKeyValue:
            - 'user:Project$sql-study'
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail

Outputs:
  SiteBucketName:
    Description: GitHub variable SITE_BUCKET.
    Value: !Ref SiteBucket
  DistributionId:
    Description: GitHub variable CLOUDFRONT_DISTRIBUTION_ID.
    Value: !Ref SiteDistribution
  DistributionDomainName:
    Description: The CNAME target for the sql record in Cloudflare (DNS only).
    Value: !GetAtt SiteDistribution.DomainName
  DeployRoleArn:
    Description: GitHub variable AWS_DEPLOY_ROLE_ARN.
    Value: !GetAtt DeployRole.Arn
